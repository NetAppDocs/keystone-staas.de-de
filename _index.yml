indexpage:
  title: Keystone Dokumentation
  summary: Keystone STaaS ist ein Abonnementangebot im Rahmen der NetApp Keystone
    Plattform, das Datei-, Block- und Objekt-Storage-Services über ein Pay-as-you-go-Modell
    bereitstellt.
  keywords: NetApp Keystone, Keystone STaaS, storage as a service, subscription
  lead: NetApp Keystone ist NetApps Storage-as-a-Service-Plattform. Keystone Storage-as-a-Service
    (STaaS), ein Abonnementangebot im Rahmen von Keystone, bietet Datei-, Block- und
    Objekt-Storage-Services im Pay-as-you-go-Modell. Keystone STaaS ermöglicht es
    Unternehmen, Storage als Betriebsausgabe zu nutzen, anstatt vorab eine Kapitalinvestition
    zu tätigen.
